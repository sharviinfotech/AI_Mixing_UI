<!-- Chat Widget Container -->
<div class="chat-widget-container">
  <!-- Chat Toggle Button -->
  <button class="chat-toggle" (click)="toggleChat()" *ngIf="!isOpen">
    <i class="fas fa-comments"></i>
    <span class="chat-toggle-text">Hey Loomi</span>
  </button>

  <!-- Chat Window -->
  <div class="chat-window" *ngIf="isOpen">
    <!-- Chat Header -->
    <div class="chat-header">
      <div class="chat-header-content">
        <div class="chat-avatar">
          <i class="fas fa-robot"></i>
        </div>
        <div class="chat-title">
          <h3>Hey Loomi</h3>
          <span class="chat-subtitle">AI Assistant</span>
        </div>
      </div>
      <button class="chat-close" (click)="toggleChat()">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <!-- Chat Messages -->
    <div class="chat-messages" #messageContainer>
      <div 
        *ngFor="let message of messages" 
        class="message"
        [class.user-message]="message.isUser"
        [class.ai-message]="!message.isUser"
      >
        <div class="message-content">
          <div class="message-text" [innerHTML]="formatMessageText(message.text)"></div>
          <div class="message-time">
            {{ message.timestamp | date:'shortTime' }}
          </div>
        </div>
      </div>
    </div>

    <!-- Chat Input -->
    <div class="chat-input-container">
      <div class="chat-input-wrapper">
        <input 
          type="text" 
          [(ngModel)]="newMessage"
          (keypress)="onKeyPress($event)"
          placeholder="Type your message..."
          class="chat-input"
        >
        <button class="chat-send" (click)="sendMessage()" [disabled]="!newMessage.trim()">
          <i class="fas fa-paper-plane"></i>
        </button>
      </div>
    </div>
  </div>
</div>
